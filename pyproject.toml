[project]
name = "spatialmem"
version = "0.1.0"
description = "Object-level 3D map + scene graph, scored against sim ground truth (114_spatial_memory)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
    "open3d>=0.18",
    "plyfile>=1.0",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    "pyyaml>=6.0.3",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "sam-2",
    "transformers==4.57.1",
    "open-clip-torch==3.3.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]
media = [
    "imageio-ffmpeg>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spatialmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
sam-2 = { git = "https://github.com/facebookresearch/sam2" }
